<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional Decomposition Diagram - FurEver PawCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #2e5e3e;
            --primary-hover: #3f7d54;
            --accent: #eaf3de;
            --border-color: #334155;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .header-container {
            text-align: center;
            margin-bottom: 24px;
            max-width: 800px;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #eaf3de 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.3s ease;
        }
        p {
            color: #94a3b8;
            margin: 0;
            font-size: 1rem;
            transition: color 0.3s ease;
        }
        .actions-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background-color: #334155;
            color: #f8fafc;
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background-color: #475569;
            transform: translateY(-1px);
        }
        .flowchart-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            width: 90%;
            max-width: 1200px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            overflow-x: auto;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .mermaid {
            width: 100%;
            background: transparent;
        }
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        @media print {
            body { background-color: #ffffff !important; color: #000000 !important; padding: 0; }
            .actions-bar { display: none; }
            .flowchart-container { border: none; box-shadow: none; padding: 0; width: 100%; background-color: #ffffff !important; }
            h1 { -webkit-text-fill-color: initial !important; color: #000000 !important; }
        }
    </style>
</head>
<body>
    <div class="header-container">
        <h1 id="title-text">Functional Decomposition Diagram</h1>
        <p id="desc-text">Breaks down the FurEver PawCare platform into its three portals and lists every module and feature in each.</p>
    </div>
    <div class="actions-bar">
        <button class="btn-secondary" id="theme-toggle" onclick="toggleTheme()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
            Switch to Light Theme (White BG)
        </button>
        <button class="btn-primary" onclick="downloadPNG()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Download PNG Image
        </button>
        <button class="btn-secondary" onclick="downloadSVG()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Download SVG Image
        </button>
        <button class="btn-secondary" onclick="window.print()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
            Print / Save PDF
        </button>
    </div>
    <div class="flowchart-container" id="flowchart-card">
        <div class="mermaid" id="mermaid-container"></div>
    </div>
    <script>
        const rawMermaidCode = `graph TD
    %% Styling
    classDef root fill:#2E5E3E,stroke:#1E3E28,stroke-width:3px,color:#FFFFFF;
    classDef portal fill:#EAF3DE,stroke:#2E5E3E,stroke-width:2px,color:#2E5E3E;
    classDef module fill:#FFFFFF,stroke:#CCCCCC,stroke-width:1.5px,color:#333333;

    %% Root
    Root["FurEver PawCare Platform"]

    %% Portals
    MobilePortal["Mobile App<br>(Pet Owner)"]
    AdminPortal["Web Admin Portal<br>(Clinic Staff)"]
    SuperAdminPortal["Web Management Portal<br>(Super Admin)"]

    Root --> MobilePortal
    Root --> AdminPortal
    Root --> SuperAdminPortal

    %% ==========================================
    %% MOBILE APP MODULES
    %% ==========================================
    subgraph MobileApp ["Mobile App Modules"]
        M_Auth["Login and Registration<br><hr>- Login and Sign Up<br>- Forgot Password<br>- Create Pet Profile<br>- Account Settings"]
        M_Health["Pet Health Records<br><hr>- Medical History<br>- Vaccination Records<br>- Vet Notes"]
        M_Monitor["Pet Monitoring<br><hr>- Pet Health Log<br>- Track Vitals<br>- Health Alerts"]
        M_Appt["Appointments<br><hr>- Browse Veterinarians<br>- Book Appointment<br>- View Booking History<br>- Calendar View"]
        M_Telemed["Online Consultations<br><hr>- Live Video Call<br>- Secure Chat<br>- View Prescriptions"]
        M_Shop["Online Shop<br><hr>- Browse Products<br>- Cart and Checkout<br>- Order Tracking<br>- Payment"]
        M_Support["Support and Learning<br><hr>- Pet Care Tutorials<br>- Submit Feedback"]
    end

    MobilePortal --> M_Auth
    MobilePortal --> M_Health
    MobilePortal --> M_Monitor
    MobilePortal --> M_Appt
    MobilePortal --> M_Telemed
    MobilePortal --> M_Shop
    MobilePortal --> M_Support

    M_Auth ~~~ M_Health
    M_Health ~~~ M_Monitor
    M_Monitor ~~~ M_Appt
    M_Appt ~~~ M_Telemed
    M_Telemed ~~~ M_Shop
    M_Shop ~~~ M_Support

    %% ==========================================
    %% WEB ADMIN MODULES
    %% ==========================================
    subgraph WebAdmin ["Web Admin Modules"]
        A_Dash["Dashboard<br><hr>- Summary Charts<br>- Staff Schedules<br>- Alerts and Notifications"]
        A_Appt["Appointment Management<br><hr>- Calendar View<br>- Approve or Decline Requests<br>- Reschedule Appointments"]
        A_Telemed["Online Consultation Management<br><hr>- Start Live Session<br>- Chat with Pet Owner<br>- Write Prescriptions"]
        A_Records["Pet Records Management<br><hr>- Pet and Owner Directory<br>- Edit Medical History<br>- Update Vaccinations"]
        A_Shop["Inventory and Products<br><hr>- Manage Product Catalog<br>- Archive and Restore Products<br>- Stock Level Warnings"]
        A_Billing["Billing and Invoicing<br><hr>- Create Invoices<br>- Track Order Payments<br>- Payment History"]
        A_Comm["Communications<br><hr>- SMS Notifications<br>- Announcements<br>- Automatic Reminders"]
        A_Access["Feedback and Tutorials<br><hr>- View Client Reviews<br>- Manage Tutorial Content"]
    end

    AdminPortal --> A_Dash
    AdminPortal --> A_Appt
    AdminPortal --> A_Telemed
    AdminPortal --> A_Records
    AdminPortal --> A_Shop
    AdminPortal --> A_Billing
    AdminPortal --> A_Comm
    AdminPortal --> A_Access

    A_Dash ~~~ A_Appt
    A_Appt ~~~ A_Telemed
    A_Telemed ~~~ A_Records
    A_Records ~~~ A_Shop
    A_Shop ~~~ A_Billing
    A_Billing ~~~ A_Comm
    A_Comm ~~~ A_Access

    %% ==========================================
    %% WEB SUPER ADMIN MODULES
    %% ==========================================
    subgraph WebSuperAdmin ["Web Super Admin Modules"]
        SA_Dash["Dashboard<br><hr>- Platform Growth Charts<br>- Total Transactions<br>- System Health Status"]
        SA_Users["User Management<br><hr>- Register Clinic Staff<br>- Manage Account Roles"]
        SA_Config["System Settings<br><hr>- Payment Settings<br>- Feature Toggles<br>- Email Server Settings"]
        SA_Finance["Billing Reports<br><hr>- Clinic Billing Summaries<br>- Platform Payment Logs"]
        SA_Audit["Activity Logs and Archive<br><hr>- Activity History<br>- Security Event Log<br>- Restore Deleted Records"]
        SA_Resources["Content Management<br><hr>- Manage Tutorials<br>- Platform Help Pages"]
    end

    SuperAdminPortal --> SA_Dash
    SuperAdminPortal --> SA_Users
    SuperAdminPortal --> SA_Config
    SuperAdminPortal --> SA_Finance
    SuperAdminPortal --> SA_Audit
    SuperAdminPortal --> SA_Resources

    SA_Dash ~~~ SA_Users
    SA_Users ~~~ SA_Config
    SA_Config ~~~ SA_Finance
    SA_Finance ~~~ SA_Audit
    SA_Audit ~~~ SA_Resources

    %% Styling
    class Root root;
    class MobilePortal,AdminPortal,SuperAdminPortal portal;
    class M_Auth,M_Health,M_Monitor,M_Appt,M_Telemed,M_Shop,M_Support module;
    class A_Dash,A_Appt,A_Telemed,A_Records,A_Shop,A_Billing,A_Comm,A_Access module;
    class SA_Dash,SA_Users,SA_Config,SA_Finance,SA_Audit,SA_Resources module;`;
        let currentTheme = 'dark';
        mermaid.initialize({ theme: 'dark', startOnLoad: false, flowchart: { useMaxWidth: true, htmlLabels: true } });
        renderDiagram();

        async function renderDiagram() {
            const container = document.getElementById('mermaid-container');
            container.removeAttribute('data-processed');
            container.innerHTML = rawMermaidCode;
            mermaid.initialize({ theme: currentTheme, startOnLoad: false, flowchart: { useMaxWidth: true, htmlLabels: true } });
            await mermaid.run({ nodes: [container] });
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'default' : 'dark';
            const btn = document.getElementById('theme-toggle');
            const card = document.getElementById('flowchart-card');
            const title = document.getElementById('title-text');
            const desc = document.getElementById('desc-text');
            if (currentTheme === 'default') {
                document.body.style.backgroundColor = '#ffffff';
                document.body.style.color = '#0f172a';
                card.style.backgroundColor = '#ffffff';
                card.style.borderColor = '#cbd5e1';
                desc.style.color = '#475569';
                title.style.background = 'initial';
                title.style.color = '#2e5e3e';
                title.style.webkitTextFillColor = 'initial';
                btn.innerHTML = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg> Switch to Dark Theme';
                btn.style.backgroundColor = '#e2e8f0';
                btn.style.color = '#0f172a';
            } else {
                document.body.style.backgroundColor = '#0f172a';
                document.body.style.color = '#f8fafc';
                card.style.backgroundColor = '#1e293b';
                card.style.borderColor = '#334155';
                desc.style.color = '#94a3b8';
                title.style.background = 'linear-gradient(135deg, #eaf3de 0%, #10b981 100%)';
                title.style.webkitBackgroundClip = 'text';
                title.style.webkitTextFillColor = 'transparent';
                btn.innerHTML = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg> Switch to Light Theme (White BG)';
                btn.style.backgroundColor = '#334155';
                btn.style.color = '#f8fafc';
            }
            renderDiagram();
        }

        function downloadSVG() {
            const svgElement = document.querySelector('.mermaid svg');
            if (!svgElement) { alert('Diagram is still rendering.'); return; }
            const clonedSvg = svgElement.cloneNode(true);
            const bg = currentTheme === 'default' ? '#ffffff' : '#0f172a';
            clonedSvg.setAttribute('style', 'background-color: ' + bg + '; padding: 20px; font-family: "Plus Jakarta Sans", sans-serif;');
            const svgString = new XMLSerializer().serializeToString(clonedSvg);
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'functional_decomposition_diagram_' + (currentTheme === 'default' ? 'white' : 'dark') + '.svg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function downloadPNG() {
            const svgElement = document.querySelector('.mermaid svg');
            if (!svgElement) { alert('Diagram is still rendering.'); return; }
            const clonedSvg = svgElement.cloneNode(true);
            const bgColor = currentTheme === 'default' ? '#ffffff' : '#0f172a';
            clonedSvg.setAttribute('style', 'background-color: ' + bgColor + '; padding: 30px; font-family: "Plus Jakarta Sans", sans-serif;');
            const svgString = new XMLSerializer().serializeToString(clonedSvg);
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const blobURL = window.URL.createObjectURL(svgBlob);
            const image = new Image();
            image.onload = () => {
                const canvas = document.createElement('canvas');
                const scale = 2;
                canvas.width = image.width * scale;
                canvas.height = image.height * scale;
                const context = canvas.getContext('2d');
                context.scale(scale, scale);
                context.fillStyle = bgColor;
                context.fillRect(0, 0, image.width, image.height);
                context.drawImage(image, 0, 0);
                const pngURL = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = pngURL;
                link.download = 'functional_decomposition_diagram_' + (currentTheme === 'default' ? 'white' : 'dark') + '.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobURL);
            };
            image.src = blobURL;
        }
    </script>
</body>
</html>
