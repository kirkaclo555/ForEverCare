<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Design Procedure - FurEver PawCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #2e5e3e;
            --primary-hover: #3f7d54;
            --accent: #eaf3de;
            --border-color: #334155;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .header-container {
            text-align: center;
            margin-bottom: 24px;
            max-width: 800px;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #eaf3de 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.3s ease;
        }
        p {
            color: #94a3b8;
            margin: 0;
            font-size: 1rem;
            transition: color 0.3s ease;
        }
        .actions-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background-color: #334155;
            color: #f8fafc;
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background-color: #475569;
            transform: translateY(-1px);
        }
        .flowchart-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            width: 90%;
            max-width: 1200px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            overflow-x: auto;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .mermaid {
            width: 100%;
            background: transparent;
        }
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        @media print {
            body { background-color: #ffffff !important; color: #000000 !important; padding: 0; }
            .actions-bar { display: none; }
            .flowchart-container { border: none; box-shadow: none; padding: 0; width: 100%; background-color: #ffffff !important; }
            h1 { -webkit-text-fill-color: initial !important; color: #000000 !important; }
        }
    </style>
</head>
<body>
    <div class="header-container">
        <h1 id="title-text">System Design Procedure</h1>
        <p id="desc-text">Shows the eight-phase development process from gathering requirements to launching the live system.</p>
    </div>
    <div class="actions-bar">
        <button class="btn-secondary" id="theme-toggle" onclick="toggleTheme()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
            Switch to Light Theme (White BG)
        </button>
        <button class="btn-primary" onclick="downloadPNG()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Download PNG Image
        </button>
        <button class="btn-secondary" onclick="downloadSVG()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Download SVG Image
        </button>
        <button class="btn-secondary" onclick="window.print()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
            Print / Save PDF
        </button>
    </div>
    <div class="flowchart-container" id="flowchart-card">
        <div class="mermaid" id="mermaid-container"></div>
    </div>
    <script>
        const rawMermaidCode = `flowchart LR
    classDef phase fill:#2E5E3E,stroke:#1E3E28,stroke-width:3px,color:#FFFFFF;
    classDef step fill:#EAF3DE,stroke:#2E5E3E,stroke-width:1.5px,color:#2E5E3E;
    classDef output fill:#FFFFFF,stroke:#CCCCCC,stroke-width:1.5px,color:#333333;
    classDef decision fill:#FFF2CC,stroke:#D6B656,stroke-width:2px,color:#5A4A1C;

    Start([Start]) --> Row1

    subgraph Row1 [Planning and Design Phases]
        direction LR

        subgraph P1 [Phase 1: Requirements]
            direction TB
            p1_title["PHASE 1<br>Gather Requirements"]
            p1_s1["1.1 Identify Users<br><hr>- Pet Owners<br>- Clinic Staff<br>- Super Admin"]
            p1_s2["1.2 Define Features<br><hr>- Pet Records and Booking<br>- Online Consultation<br>- Shop and Billing"]
            p1_s3["1.3 Define System Rules<br><hr>- Multi-clinic support<br>- Real-time health data<br>- Secure login with roles"]
            p1_out["OUTPUT: Requirements Document"]
            p1_title --> p1_s1 --> p1_s2 --> p1_s3 --> p1_out
        end

        subgraph P2 [Phase 2: System Design]
            direction TB
            p2_title["PHASE 2<br>Design System Structure"]
            p2_s1["2.1 Choose Architecture<br><hr>- Shared code repository<br>- Layered app design<br>- Web API communication"]
            p2_s2["2.2 Choose Technologies<br><hr>- Next.js Web App<br>- React Native Mobile<br>- PostgreSQL Database"]
            p2_s3["2.3 Define Boundaries<br><hr>- Set platform scope<br>- Identify external services<br>- Map data flow paths"]
            p2_out["OUTPUT: System Design Document"]
            p2_title --> p2_s1 --> p2_s2 --> p2_s3 --> p2_out
        end

        subgraph P3 [Phase 3: Feature Breakdown]
            direction TB
            p3_title["PHASE 3<br>Break Down Features"]
            p3_s1["3.1 Divide by Portal<br><hr>- Pet Owner App<br>- Clinic Staff Portal<br>- Super Admin Portal"]
            p3_s2["3.2 List All Modules<br><hr>- Login and Appointments<br>- Consultations and Inventory<br>- SMS and Reports"]
            p3_s3["3.3 Map User Actions<br><hr>- Assign features to roles<br>- Trace user journeys<br>- Plan alternative paths"]
            p3_out["OUTPUT: Feature List and Use Cases"]
            p3_title --> p3_s1 --> p3_s2 --> p3_s3 --> p3_out
        end

        subgraph P4 [Phase 4: Database Design]
            direction TB
            p4_title["PHASE 4<br>Design the Database"]
            p4_s1["4.1 Identify Tables<br><hr>- Users and Staff<br>- Pets and Appointments<br>- Products and Payments"]
            p4_s2["4.2 Define Relationships<br><hr>- Owners own Pets<br>- Users book Appointments<br>- Orders have Payments"]
            p4_s3["4.3 Build Schema<br><hr>- Write database models<br>- Set up connections<br>- Create data dictionary"]
            p4_out["OUTPUT: ERD and Data Dictionary"]
            p4_title --> p4_s1 --> p4_s2 --> p4_s3 --> p4_out
        end

        P1 --> P2 --> P3 --> P4
    end

    P4 --> P5

    subgraph Row2 [Development and Deployment Phases]
        direction LR

        subgraph P5 [Phase 5: UI Design]
            direction TB
            p5_title["PHASE 5<br>Design User Interface"]
            p5_s1["5.1 Map Screen Flows<br><hr>- Mobile screen paths<br>- Admin sidebar navigation<br>- Login pages"]
            p5_s2["5.2 Design Layouts<br><hr>- Tab navigation views<br>- Dashboard grids<br>- Forms and dialogs"]
            p5_s3["5.3 Set Design Standards<br><hr>- Green color palette<br>- Typography and fonts<br>- Spacing rules"]
            p5_out["OUTPUT: Flowcharts and Design Guide"]
            p5_title --> p5_s1 --> p5_s2 --> p5_s3 --> p5_out
        end

        subgraph P6 [Phase 6: Connect Services]
            direction TB
            p6_title["PHASE 6<br>Connect Services"]
            p6_s1["6.1 Build Web APIs<br><hr>- Login and Appointment APIs<br>- Billing and Shop APIs<br>- Consultation APIs"]
            p6_s2["6.2 External Services<br><hr>- Payment processing<br>- SMS messaging<br>- Push notifications"]
            p6_s3["6.3 Add Security<br><hr>- Session management<br>- Role permissions<br>- Input validation"]
            p6_out["OUTPUT: API Documentation"]
            p6_title --> p6_s1 --> p6_s2 --> p6_s3 --> p6_out
        end

        subgraph P7 [Phase 7: Build System]
            direction TB
            p7_title["PHASE 7<br>Develop Application"]
            p7_s1["7.1 Set Up Project<br><hr>- Create folder structure<br>- Configure packages<br>- Install dependencies"]
            p7_s2["7.2 Build Features<br><hr>- Develop components<br>- Build server logic<br>- Run database updates"]
            p7_s3["7.3 Test and Review<br><hr>- Check for errors<br>- Follow coding standards<br>- Run build tests"]
            p7_out["OUTPUT: Working Application"]
            p7_title --> p7_s1 --> p7_s2 --> p7_s3 --> p7_out
        end

        subgraph P8 [Phase 8: Launch]
            direction TB
            p8_title["PHASE 8<br>Deploy and Maintain"]
            p8_s1["8.1 Prepare Server<br><hr>- Set up production server<br>- Configure database<br>- Set security keys"]
            p8_s2["8.2 Go Live<br><hr>- Test on staging<br>- Deploy final version<br>- Run migrations"]
            p8_s3["8.3 Maintenance<br><hr>- Monitor system health<br>- Review activity logs<br>- Apply feedback updates"]
            p8_out["OUTPUT: Live System"]
            p8_title --> p8_s1 --> p8_s2 --> p8_s3 --> p8_out
        end

        P5 --> P6 --> P7 --> P8
    end

    P8 --> End([System is Live])

    class p1_title,p2_title,p3_title,p4_title,p5_title,p6_title,p7_title,p8_title phase;
    class p1_s1,p1_s2,p1_s3,p2_s1,p2_s2,p2_s3,p3_s1,p3_s2,p3_s3,p4_s1,p4_s2,p4_s3 step;
    class p5_s1,p5_s2,p5_s3,p6_s1,p6_s2,p6_s3,p7_s1,p7_s2,p7_s3,p8_s1,p8_s2,p8_s3 step;
    class p1_out,p2_out,p3_out,p4_out,p5_out,p6_out,p7_out,p8_out output;
    class Start,End decision;`;
        let currentTheme = 'dark';
        mermaid.initialize({ theme: 'dark', startOnLoad: false, flowchart: { useMaxWidth: true, htmlLabels: true } });
        renderDiagram();

        async function renderDiagram() {
            const container = document.getElementById('mermaid-container');
            container.removeAttribute('data-processed');
            container.innerHTML = rawMermaidCode;
            mermaid.initialize({ theme: currentTheme, startOnLoad: false, flowchart: { useMaxWidth: true, htmlLabels: true } });
            await mermaid.run({ nodes: [container] });
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'default' : 'dark';
            const btn = document.getElementById('theme-toggle');
            const card = document.getElementById('flowchart-card');
            const title = document.getElementById('title-text');
            const desc = document.getElementById('desc-text');
            if (currentTheme === 'default') {
                document.body.style.backgroundColor = '#ffffff';
                document.body.style.color = '#0f172a';
                card.style.backgroundColor = '#ffffff';
                card.style.borderColor = '#cbd5e1';
                desc.style.color = '#475569';
                title.style.background = 'initial';
                title.style.color = '#2e5e3e';
                title.style.webkitTextFillColor = 'initial';
                btn.innerHTML = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg> Switch to Dark Theme';
                btn.style.backgroundColor = '#e2e8f0';
                btn.style.color = '#0f172a';
            } else {
                document.body.style.backgroundColor = '#0f172a';
                document.body.style.color = '#f8fafc';
                card.style.backgroundColor = '#1e293b';
                card.style.borderColor = '#334155';
                desc.style.color = '#94a3b8';
                title.style.background = 'linear-gradient(135deg, #eaf3de 0%, #10b981 100%)';
                title.style.webkitBackgroundClip = 'text';
                title.style.webkitTextFillColor = 'transparent';
                btn.innerHTML = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg> Switch to Light Theme (White BG)';
                btn.style.backgroundColor = '#334155';
                btn.style.color = '#f8fafc';
            }
            renderDiagram();
        }

        function downloadSVG() {
            const svgElement = document.querySelector('.mermaid svg');
            if (!svgElement) { alert('Diagram is still rendering.'); return; }
            const clonedSvg = svgElement.cloneNode(true);
            const bg = currentTheme === 'default' ? '#ffffff' : '#0f172a';
            clonedSvg.setAttribute('style', 'background-color: ' + bg + '; padding: 20px; font-family: "Plus Jakarta Sans", sans-serif;');
            const svgString = new XMLSerializer().serializeToString(clonedSvg);
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'system_design_procedure_' + (currentTheme === 'default' ? 'white' : 'dark') + '.svg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function downloadPNG() {
            const svgElement = document.querySelector('.mermaid svg');
            if (!svgElement) { alert('Diagram is still rendering.'); return; }
            const clonedSvg = svgElement.cloneNode(true);
            const bgColor = currentTheme === 'default' ? '#ffffff' : '#0f172a';
            clonedSvg.setAttribute('style', 'background-color: ' + bgColor + '; padding: 30px; font-family: "Plus Jakarta Sans", sans-serif;');
            const svgString = new XMLSerializer().serializeToString(clonedSvg);
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const blobURL = window.URL.createObjectURL(svgBlob);
            const image = new Image();
            image.onload = () => {
                const canvas = document.createElement('canvas');
                const scale = 2;
                canvas.width = image.width * scale;
                canvas.height = image.height * scale;
                const context = canvas.getContext('2d');
                context.scale(scale, scale);
                context.fillStyle = bgColor;
                context.fillRect(0, 0, image.width, image.height);
                context.drawImage(image, 0, 0);
                const pngURL = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = pngURL;
                link.download = 'system_design_procedure_' + (currentTheme === 'default' ? 'white' : 'dark') + '.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobURL);
            };
            image.src = blobURL;
        }
    </script>
</body>
</html>
